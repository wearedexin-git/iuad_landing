  <meta charset="UTF-8" />

  <title>Iscrizione confermata – Design della Moda | IUAD</title>
  <style>
    @font-face {
      font-family: 'Tiempos Headline';
      src: url('/src/assets/fonts/TiemposHeadline-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('/src/assets/fonts/Sarabun-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('/src/assets/fonts/Sarabun-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D6E2F0;
      font-family: 'Sarabun', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 40px;
      padding: 60px 48px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 48px rgba(32,31,31,0.08);
    }

    .logo {
      width: 80px;
      margin: 0 auto 40px;
      display: block;
    }

    h1 {
      font-family: 'Tiempos Headline', Georgia, serif;
      font-weight: 700;
      font-size: clamp(30px, 5vw, 46px);
      color: #8D9EBD;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    p {
      font-family: 'Sarabun', sans-serif;
      font-size: clamp(16px, 2vw, 20px);
      color: #201f1f;
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 32px;
      background: #8D9EBD;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Tiempos Headline', Georgia, serif;
      font-weight: 700;
      font-size: clamp(18px, 2.5vw, 26px);
      line-height: 1;
      padding: 20px 32px;
      border-radius: 100px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { opacity: 0.9; }
    .back-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WC7LGZ4B"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=200101197259749&ev=PageView&noscript=1"
  /></noscript>

  <div class="card">

    <img
      class="logo"
      src="assets/logo_iuad_black.png"
      alt="IUAD Accademia di Moda e Design"
    />

    <h1 id="thankyou-title">Iscrizione confermata!</h1>

    <p id="thankyou-message">Grazie per aver completato la registrazione all'<strong>Open Day</strong> di IUAD. Ti abbiamo inviato una mail di conferma.<br>Non vediamo l'ora di incontrarti!</p>

    <p><strong>Corso:</strong> Design della Moda</p>
    <p><strong>Sede:</strong> <span id="selected-sede">-</span></p>
    <p id="selected-data-row"><strong>Data Open Day:</strong> <span id="selected-data">-</span></p>

    <a class="back-btn" href="index.html">Torna alla pagina</a>

  </div>

</body>
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const sede = params.get('sede') || 'Milano';
    const data = params.get('data') || '-';
    const isOrientamento = params.get('tipo') === 'orientamento';

    const sedeNode = document.getElementById('selected-sede');
    const dataNode = document.getElementById('selected-data');
    const dataRow = document.getElementById('selected-data-row');
    const titleNode = document.getElementById('thankyou-title');
    const messageNode = document.getElementById('thankyou-message');

    if (sedeNode) sedeNode.textContent = sede;
    if (dataNode) dataNode.textContent = data;

    if (isOrientamento) {
      if (titleNode) titleNode.textContent = 'Prenotazione confermata!';
      if (messageNode) {
        messageNode.innerHTML = 'Grazie per aver prenotato il tuo <strong>orientamento personalizzato</strong> con IUAD. Ti abbiamo inviato una mail di conferma.<br>Non vediamo l\'ora di incontrarti!';
      }
      if (dataRow) {
        dataRow.innerHTML = '<strong>Tipo appuntamento:</strong> <span id="selected-data">' + data + '</span>';
      }
    }

    if (typeof window.fbq === 'function') {
      window.fbq('track', 'Lead', {
        content_name: 'Landing - Design della Moda',
        sede: sede,
        open_day_date: data
      });
    }

    /* gtag conversion (disattivato – gestito via GTM-WC7LGZ4B)
    if (typeof window.gtag === 'function') {
      window.gtag('event', 'conversion', {
        send_to: 'AW-1001604186/uFRTCIf4hoMcENqIzd0D',
        value: 1.0,
        currency: 'EUR',
        sede: sede,
        open_day_date: data
      });
    }
    */

    if (Array.isArray(window.dataLayer)) {
      window.dataLayer.push({
        event: 'thankyou_open_day',
        sede: sede,
        open_day_date: data
      });
    }
  })();
</script>
</html>
