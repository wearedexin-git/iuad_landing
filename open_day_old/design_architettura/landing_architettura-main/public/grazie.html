      font-display: swap;
    }

      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #D6E2F0;
      font-family: 'Sarabun', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 40px;
      padding: 60px 48px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 48px rgba(32,31,31,0.08);
    }

    .logo {
      width: 80px;
      margin: 0 auto 40px;
      display: block;
    }

    h1 {
      font-family: 'Tiempos Headline', Georgia, serif;
      font-weight: 700;
      font-size: clamp(30px, 5vw, 46px);
      color: #8D9EBD;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    p {
      font-family: 'Sarabun', sans-serif;
      font-size: clamp(16px, 2vw, 20px);
      color: #201f1f;
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 32px;
      background: #8D9EBD;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Tiempos Headline', Georgia, serif;
      font-weight: 700;
      font-size: clamp(18px, 2.5vw, 26px);
      line-height: 1;
      padding: 20px 32px;
      border-radius: 100px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { opacity: 0.9; }
    .back-btn:active { transform: scale(0.98); }
