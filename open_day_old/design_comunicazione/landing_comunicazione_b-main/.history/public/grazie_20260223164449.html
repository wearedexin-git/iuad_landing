<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iscrizione confermata – IUAD</title>
  <style>
    @font-face {
      font-family: 'Tiempos Headline';
      src: url('/src/assets/fonts/TiemposHeadline-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('/src/assets/fonts/Sarabun-Light.woff2') format('woff2');
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('/src/assets/fonts/Sarabun-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f4dbcc;
      font-family: 'Sarabun', sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 40px;
      padding: 60px 48px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 48px rgba(32,31,31,0.08);
    }

    .logo {
      width: 80px;
      margin: 0 auto 40px;
      display: block;
    }

    h1 {
      font-family: 'Tiempos Headline', Georgia, serif;
      font-weight: 700;
      font-size: clamp(30px, 5vw, 46px);
      color: #d06321;
      line-height: 1.2;
      margin-bottom: 24px;
    }

    p {
      font-family: 'Sarabun', sans-serif;
      font-size: clamp(16px, 2vw, 20px);
      color: #201f1f;
      line-height: 1.7;
      font-weight: 300;
      margin-bottom: 12px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 32px;
      background: #d06321;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Tiempos Headline', Georgia, serif;
      font-weight: 700;
      font-size: clamp(18px, 2.5vw, 26px);
      line-height: 1;
      padding: 20px 32px;
      border-radius: 100px;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { opacity: 0.9; }
    .back-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="card">

    <img
      class="logo"
      src="https://www.accademiamoda.it/wp-content/uploads/2022/05/IUAD-logo-nero-2022.png"
      alt="IUAD Accademia di Moda e Design"
    />

    <h1>Iscrizione confermata!</h1>

    <p>Grazie per aver completato la registrazione all'<strong>Open Day</strong> di IUAD. Ti abbiamo inviato una mail di conferma.<br>Non vediamo l'ora di incontrarti!</p>

    <p><strong>Corso:</strong> Art Direction &amp; Copywriting</p>
    <p><strong>Sede:</strong> Napoli</p>

    <a class="back-btn" href="index.html">Torna alla pagina</a>

  </div>

</body>
</html>
